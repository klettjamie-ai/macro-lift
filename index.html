<title>Macro &amp; Lift</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--card2:#f0f2f5;--tx:#14171c;--mut:#6b7280;--bd:#e3e6eb;--ac:#4f6bff;--ac2:#e9edff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
--kc:#4f6bff;--pr:#ef4444;--cb:#f59e0b;--ft:#10b981;--sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
:root.dark{--bg:#0f1115;--card:#181b21;--card2:#22262e;--tx:#e8eaed;--mut:#9aa1ad;--bd:#2b3039;--ac:#7b8cff;--ac2:#252b45;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.iconbtn{border:0;background:var(--card2);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px}
main{padding:12px 14px;max-width:640px;margin:0 auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:none;padding:8px 2px 9px;color:var(--mut);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button span{font-size:19px;line-height:1}
nav.bottom button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}.c{text-align:center}.r{text-align:right}
.btn{border:1px solid var(--bd);background:var(--card2);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%;display:block}
.btn:disabled{opacity:.5}
.link{border:0;background:none;color:var(--ac);font-weight:600;cursor:pointer;padding:4px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:5px 11px;white-space:nowrap;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.list .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
.list .it:first-child{border-top:0}
.it .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--ac2);color:var(--ac)}
.pill.pr{background:#fde68a;color:#92400e}
.pill.ok{background:#dcfce7;color:#166534}
.ringwrap{display:flex;align-items:center;gap:16px}
.bars{flex:1;display:flex;flex-direction:column;gap:9px}
.bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px}
.mtot{font-size:12.5px;color:var(--mut);white-space:nowrap}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.daynav b{font-size:16px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2}
.sheet .hd h3{flex:1;margin:0;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:600;font-size:14px;max-width:90%;text-align:center}
.stat{background:var(--card2);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:11.5px;color:var(--mut)}
table.sets{width:100%;border-collapse:collapse;table-layout:fixed}
table.sets th{font-size:11px;color:var(--mut);font-weight:700;text-align:center;padding:3px}
table.sets td{padding:3px;text-align:center}
table.sets input,table.sets select{padding:7px 2px;text-align:center;border-radius:8px}
table.sets select{appearance:none;-webkit-appearance:none;text-align-last:center}
table.sets tr.done td{background:rgba(22,163,74,.12)}
table.sets tr.warm td:first-child{color:var(--warn);font-weight:700}
.chk{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--card2);cursor:pointer;font-weight:800}
tr.done .chk{background:var(--ok);color:#fff;border-color:var(--ok)}
.sugg{background:var(--ac2);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0 8px}
.sugg b{color:var(--ac)}
#restbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:30;display:none;justify-content:center}
#restbar .in{background:var(--tx);color:var(--bg);border-radius:14px;margin:0 10px;padding:8px 10px;display:flex;align-items:center;gap:8px;width:100%;max-width:620px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#restbar .t{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-width:62px}
#restbar .pb{flex:1;height:6px;background:rgba(127,127,127,.35);border-radius:4px;overflow:hidden}
#restbar .pb i{display:block;height:100%;background:var(--ac)}
#restbar button{border:0;border-radius:8px;padding:6px 9px;font-weight:700;background:rgba(127,127,127,.3);color:inherit;cursor:pointer}
.vol .vr{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.vol .track{position:relative;height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.vol .track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.vol .zone{position:absolute;top:0;bottom:0;border-left:1px dashed var(--mut);border-right:1px dashed var(--mut);opacity:.6}
svg text{fill:var(--mut);font-size:10px}
.empty{color:var(--mut);text-align:center;padding:18px 6px}
.ob{max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
.ob h2{font-size:22px;margin:10px 0 4px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);padding:11px 12px;border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--ac);background:var(--ac2)}
.opt small{display:block;color:var(--mut)}
.star{border:0;background:none;font-size:20px;cursor:pointer;color:var(--warn)}
.scanbox{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;margin-bottom:12px;border:1px solid var(--bd)}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .reticle{position:absolute;left:8%;right:8%;top:28%;bottom:28%;border:2px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.38)}
.scanbox .reticle::after{content:'';position:absolute;left:5%;right:5%;top:50%;height:2px;background:var(--bad);box-shadow:0 0 8px var(--bad);animation:scanln 1.8s ease-in-out infinite}
@keyframes scanln{0%,100%{transform:translateY(-24px)}50%{transform:translateY(24px)}}
.scanbox .scanst{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:12.5px;font-weight:600;text-shadow:0 1px 3px #000}
.vidbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.vidbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidbox.clip{aspect-ratio:auto;min-height:200px}.vidbox video{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;background:#000}
.vidbox.off{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--card2);padding:14px}
ol.cues{margin:0;padding-left:20px}ol.cues li{margin:0 0 7px;line-height:1.45}
hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
</style>
</head>

const HOWTO_TXT=`barbell-bench-press|Chest · front delts · triceps|Eyes under the bar, feet planted, shoulder blades squeezed back and down.^Grip just outside shoulder width; lower the bar to mid/lower chest with elbows ~45–70° from the body.^Touch lightly, then press up and slightly back toward your face. Keep butt on the bench.
incline-barbell-bench-press|Upper chest · front delts · triceps|Set the bench to about 30°; too steep turns it into a shoulder press.^Lower to the upper chest just below the collarbones, wrists stacked over elbows.^Keep shoulder blades pinned and drive the bar straight up.
decline-barbell-bench-press|Lower chest · triceps · front delts|Hook your legs securely and have a spotter hand off the bar.^Lower to the lower chest under control, elbows slightly tucked.^Press up over the shoulders; keep the range smooth, no bouncing.
dumbbell-bench-press|Chest · front delts · triceps|Kick the dumbbells up from your knees as you lie back; shoulder blades back and down.^Lower until the dumbbells are beside your chest with a deep, comfortable stretch.^Press up and slightly in; don't clank the bells together at the top.
incline-dumbbell-press|Upper chest · front delts · triceps|Bench at 30–45°; plant feet and arch slightly with chest up.^Lower the dumbbells to upper-chest level, elbows under the wrists.^Press up in a slight arc, stopping just short of locking out.
dumbbell-floor-press|Chest · triceps · front delts|Lie on the floor, knees bent, dumbbells over the shoulders.^Lower until the upper arms touch the floor lightly; pause, no bounce.^Press back up; elbows ~45° from the body. Great without a bench or for sore shoulders.
dumbbell-fly|Chest · front delts|Slight, fixed bend in the elbows the whole set, like hugging a tree.^Open the arms wide until you feel a stretch across the chest; stop before the shoulders strain.^Squeeze the chest to bring the bells back up over the chest. Go lighter than you think.
cable-crossover|Chest · front delts|Stand centered with a staggered stance and a slight forward lean.^Soft elbows; sweep the handles down and together in front of your hips.^Control the return until you feel a chest stretch.
low-to-high-cable-fly|Upper chest · front delts|Set pulleys at the lowest position and step forward.^Palms up, sweep the handles up and together to about chin height.^Keep the elbows soft and the ribs down; don't lean back.
machine-chest-press|Chest · triceps · front delts|Adjust the seat so the handles line up with mid-chest.^Shoulder blades back against the pad; press without shrugging.^Control the return until you feel a stretch, then press again.
smith-machine-incline-press|Upper chest · front delts · triceps|Bench at ~30°, positioned so the bar meets your upper chest.^Grip slightly wider than shoulders, shoulder blades pinned.^Lower under control and press; use the safety stops.
pec-deck|Chest|Adjust the seat so handles are at chest height.^Keep a slight elbow bend and the chest tall.^Squeeze the handles together, then let them open slowly to a comfortable stretch.
push-up|Chest · triceps · front delts · core|Hands just outside the shoulders, body in one straight line from head to heels.^Lower your chest to just above the floor, elbows ~45° from the body.^Push the floor away; brace your abs and glutes so the hips don't sag. Elevate hands to make it easier.
chest-dip|Lower chest · triceps · front delts|Lean the torso forward and let the elbows flare slightly.^Lower until the shoulders are just below the elbows, or as deep as is comfortable.^Press back up without shrugging. Use an assisted machine or band if needed.
deadlift|Glutes · hamstrings · back · traps · grip|Bar over mid-foot, shins close, hip-width stance.^Hinge down, grip outside the legs, flat back, chest up, take the slack out of the bar.^Push the floor away and stand tall; keep the bar close and lower it the same way.
barbell-row|Lats · upper back · rear delts · biceps|Hinge to about 45°, flat back, knees soft.^Pull the bar to your lower ribs/belly, driving the elbows back.^Lower under control; don't jerk with the hips.
pendlay-row|Upper back · lats · rear delts|Torso near parallel to the floor, bar starting on the floor each rep.^Explosively row the bar to the lower chest.^Return the bar to the floor, reset your back, repeat.
t-bar-row|Upper back · lats · rear delts · biceps|Brace with a flat back and chest up.^Pull the handles toward your chest, squeezing the shoulder blades together.^Lower slowly to a full stretch without rounding.
rack-pull|Upper back · traps · glutes · hamstrings|Set the bar at or just below the knees in a rack.^Same setup as a deadlift: flat back, lats tight.^Drive hips forward to stand tall; don't lean back at the top.
pull-up|Lats · upper back · biceps|Overhand grip slightly wider than shoulders; start from a full hang.^Pull your chest toward the bar, driving the elbows down to your sides.^Lower all the way down under control. Use a band or assisted machine to build up.
chin-up|Lats · biceps · upper back|Underhand, shoulder-width grip from a dead hang.^Pull until your chin clears the bar, ribs down, no kipping.^Lower slowly to full extension.
inverted-row|Upper back · lats · biceps|Set a bar about waist height; body straight from head to heels.^Pull your chest to the bar, squeezing the shoulder blades.^Lower under control. Bend the knees to make it easier.
lat-pulldown|Lats · upper back · biceps|Thighs locked under the pad, grip a bit wider than shoulders.^Lean back slightly and pull the bar to your upper chest, elbows down and back.^Let the bar rise slowly until the arms are straight and the lats stretch.
close-grip-lat-pulldown|Lats · biceps · mid back|Use a close neutral (V) handle.^Pull to the upper chest, elbows tight to the body.^Control the return to a full stretch.
seated-cable-row|Mid back · lats · rear delts · biceps|Sit tall, knees soft, chest up.^Pull the handle to your belly, squeezing the shoulder blades together.^Reach forward to stretch, without rounding your lower back.
straight-arm-pulldown|Lats|Stand at a high cable with arms nearly straight.^Hinge slightly and sweep the bar down to your thighs.^Return slowly overhead; keep the elbows locked at a soft bend.
single-arm-dumbbell-row|Lats · upper back · biceps|One hand and knee on the bench, back flat and parallel to the floor.^Row the dumbbell toward your hip, elbow close to the body.^Lower to a full stretch; don't twist the torso.
chest-supported-dumbbell-row|Upper back · lats · rear delts|Lie chest-down on a bench at 30–45°.^Row both dumbbells, squeezing the shoulder blades together.^Lower to a full stretch; keep the chest on the pad.
machine-row|Mid back · lats · biceps|Adjust the chest pad so arms are fully extended at the start.^Pull the handles back, squeezing the shoulder blades.^Return slowly; don't let the weight stack slam.
back-extension|Lower back · glutes · hamstrings|Hip bone just above the pad edge.^Lower your torso under control with a neutral spine.^Raise until your body is in a straight line; don't hyperextend.
overhead-press|Front delts · side delts · triceps · upper chest|Bar on the front of the shoulders, grip just outside shoulders, glutes and abs tight.^Press straight up, moving your head back then through once the bar passes your face.^Finish with the bar over mid-foot, biceps by the ears.
seated-dumbbell-shoulder-press|Front & side delts · triceps|Bench upright (~80–90°), dumbbells at shoulder height.^Press up and slightly in without banging the bells.^Lower to about ear level with control.
arnold-press|Front & side delts · triceps|Start with palms facing you at chin height.^Rotate the palms forward as you press overhead.^Reverse the rotation on the way down.
machine-shoulder-press|Front & side delts · triceps|Set the seat so handles start at shoulder height.^Press up without locking out hard or shrugging.^Lower under control.
landmine-press|Front delts · upper chest · triceps · core|Hold the end of the bar at shoulder height, staggered stance.^Press up and forward along the bar's arc.^Brace your core and avoid leaning back.
upright-row|Side delts · traps|Grip about shoulder width, a bit wider is easier on the shoulders.^Lead with the elbows and lift to lower-chest height.^Stop if you feel shoulder pinching; lower slowly.
dumbbell-lateral-raise|Side delts|Slight lean forward, soft elbows.^Raise the dumbbells out to the sides to shoulder height, leading with the elbows.^Lower slowly; no swinging. Light weight, strict form.
cable-lateral-raise|Side delts|Stand side-on to a low pulley and hold the handle with the far hand.^Raise out to shoulder height with a soft elbow.^Lower slowly, keeping tension at the bottom.
machine-lateral-raise|Side delts|Pads on the outside of the upper arms, seat set so shoulders align with the pivot.^Raise to shoulder height.^Control the descent; don't shrug.
dumbbell-front-raise|Front delts|Stand tall with dumbbells in front of the thighs.^Raise straight in front to shoulder height, elbows soft.^Lower slowly without swinging.
dumbbell-rear-delt-fly|Rear delts · upper back|Hinge forward with a flat back or lie chest-down on an incline bench.^With soft elbows, raise the dumbbells out to the sides.^Squeeze the rear delts, then lower slowly.
reverse-pec-deck|Rear delts · upper back|Face the pad, handles at shoulder height.^Sweep the arms back in an arc with soft elbows.^Control the return.
face-pull|Rear delts · upper back · rotator cuff|Rope at upper-chest or face height.^Pull toward your face, splitting the rope and rotating the hands back.^Finish like a double-biceps pose, then return slowly.
band-pull-apart|Rear delts · upper back|Hold a band at shoulder width, arms straight in front.^Pull the band apart until it touches your chest.^Return slowly; keep the ribs down.
barbell-curl|Biceps · forearms|Shoulder-width underhand grip, elbows at your sides.^Curl without swinging the torso.^Lower slowly to full extension.
ez-bar-curl|Biceps · forearms|Grip the angled part of the bar for comfortable wrists.^Curl up with elbows pinned to your sides.^Lower under control.
dumbbell-curl|Biceps · forearms|Stand tall, palms forward, elbows by your sides.^Curl up and squeeze; don't let the elbows drift forward.^Lower slowly all the way.
hammer-curl|Brachialis · biceps · forearms|Palms facing each other (neutral grip).^Curl up, keeping the elbows still.^Lower under control.
incline-dumbbell-curl|Biceps (long head)|Bench at 45–60°, arms hanging straight down.^Curl without moving the upper arm forward.^Lower to a full stretch.
concentration-curl|Biceps|Sit and brace your elbow against the inner thigh.^Curl toward the shoulder and squeeze.^Lower slowly to a full stretch.
spider-curl|Biceps (short head)|Lie chest-down on an incline bench, arms hanging straight down.^Curl up and squeeze at the top.^Lower slowly; the upper arm stays vertical.
preacher-curl|Biceps|Armpits snug against the top of the pad.^Curl up without lifting the elbows.^Lower slowly to almost straight; don't hyperextend.
cable-curl|Biceps|Stand at a low pulley with a bar or rope.^Curl with elbows at your sides.^Lower slowly, keeping tension.
bayesian-cable-curl|Biceps (long head)|Face away from a low pulley, arm slightly behind your body.^Curl forward and up while keeping the elbow back.^Return to a deep stretch.
close-grip-bench-press|Triceps · chest · front delts|Grip about shoulder width.^Lower to the lower chest with elbows tucked.^Press up by driving through the triceps.
skull-crusher|Triceps|Lie on a bench holding the bar over your shoulders.^Bend only at the elbows to lower the bar toward your forehead or just behind your head.^Extend back up; keep the upper arms still.

overhead-cable-triceps-extension|Triceps (long head)|Face away from the pulley with the rope behind your head.^Extend the arms forward and up.^Return to a deep stretch behind the head.
overhead-dumbbell-triceps-extension|Triceps (long head)|Hold one dumbbell overhead with both hands.^Lower it behind your head by bending the elbows.^Extend back up; keep the elbows pointing forward.

diamond-push-up|Triceps · chest|Hands together under your chest, forming a diamond.^Lower your chest toward your hands, elbows tucked.^Press up; keep the body in a straight line.
machine-dip|Triceps · chest|Set the seat so handles are at your sides.^Press down until the arms are straight.^Return slowly to about 90° at the elbow.
back-squat|Quads · glutes · adductors · core|Bar on the upper back, feet about shoulder width, toes slightly out.^Brace, then sit down and back, knees tracking over the toes.^Reach at least parallel if you can, then drive up through the whole foot.

function incKg(ex){const lower=['Quads','Hamstrings','Glutes'].includes(ex.m);
 if(isLb()){const lb=(ex.eq==='Barbell'&&lower&&ex.t==='c')?10:5;return lb/2.2046226}

function roundStep(ex){return isLb()?(ex.eq==='Dumbbell'||ex.eq==='Barbell'?5:2.5)/2.2046226:(ex.eq==='Dumbbell'?1:2.5)}
const roundW=(kg,ex)=>{const s=roundStep(ex);return Math.round(kg/s)*s};
function workSets(sess,exId){const e=sess.exs.find(x=>x.exId===exId);return e?e.sets.filter(s=>!s.warm&&s.done&&s.r>0):[]}

function suggestNext(exId,repMin,repMax,nSets){
 const ex=exById(exId);const H=exHistory(exId);
 if(!H.length)return{kind:'new',w:null,reps:repMax,text:`First time: pick a weight you could lift for about ${repMax+2} reps, then do ${repMax} (2–3 reps in reserve).`};
 const last=workSets(H[H.length-1],exId);const topW=Math.max(...last.map(s=>s.w||0));
 const top=last.filter(s=>(s.w||0)===topW);const minR=Math.min(...top.map(s=>s.r));
 const rirs=top.map(s=>s.rir).filter(x=>x!==''&&x!=null&&!isNaN(x)).map(Number);const avgRir=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
 const enoughSets=!nSets||last.length>=nSets;
 const inc=incKg(ex);
 if(minR>=repMax&&enoughSets){
  if(topW===0)return{kind:'up',w:0,reps:repMax,text:`Hit ${repMax}+ reps on every set. Add load (e.g. ${dispW(inc)} ${wu()}) or move to a harder variation.`};
  const mult=avgRir!=null&&avgRir>=3?2:1;const nw=roundW(topW+inc*mult,ex)||topW+inc*mult;
  return{kind:'up',w:nw,reps:repMin,text:`Hit ${repMax} reps on all sets last time${mult>1?' with 3+ RIR':''} → add weight, reset to ${repMin} reps.`}}
 if(minR<repMin){
  const prev=H.length>1?workSets(H[H.length-2],exId):[];const prevMiss=prev.length&&Math.max(...prev.map(s=>s.w||0))===topW&&Math.min(...prev.filter(s=>s.w===topW).map(s=>s.r))<repMin;
  if(prevMiss&&topW>0)return{kind:'deload',w:roundW(topW*0.9,ex),reps:repMin,text:`Missed ${repMin} reps two sessions in a row → back off ~10% and build up again.`};
  return{kind:'hold',w:topW,reps:repMin,text:`Fell short of ${repMin} reps → keep the weight and aim for ${repMin} on every set.`}}
 const target=Math.min(repMax,minR+1);
 return{kind:'reps',w:topW,reps:target,text:`In range (${minR}–${Math.max(...top.map(s=>s.r))} reps) → same weight, aim for ${target}+ reps per set.`}}
function warmups(ex,workKg){
 if(!workKg||workKg<=0)return[];const out=[];const bar=isLb()?45/2.2046226:20;
 const sch=ex.t==='c'?[[0,10],[0.5,5],[0.7,3],[0.85,1]]:[[0.5,10]];
 for(const [pct,r] of sch){let w;if(pct===0){if(ex.eq!=='Barbell')continue;w=bar}else w=roundW(workKg*pct,ex);
  if(ex.eq==='Barbell'&&w<bar)w=bar;if(w>=workKg-0.01)continue;if(out.length&&Math.abs(out[out.length-1].w-w)<0.01)continue;if(pct===0.85&&workKg<(isLb()?135:60)/(isLb()?2.2046226:1))continue;out.push({w,r})}

// Open Food Facts (CORS-enabled public API). Tries the new search service, then the classic endpoint.
// Per-100 g macros from OFF nutriments. energy_100g / energy-kj_100g are kJ (÷4.184); with no energy at all, use 4/4/9.
function offNutr(n){n=n||{};const v=k=>{const x=parseFloat(n[k]);return isFinite(x)?x:null};const p=v('proteins_100g'),c=v('carbohydrates_100g'),f=v('fat_100g');
 let kcal=v('energy-kcal_100g');if(kcal==null){const kj=v('energy-kj_100g')??v('energy_100g');if(kj!=null)kcal=kj/4.184}
 if(kcal==null&&(p!=null||c!=null||f!=null))kcal=4*(p||0)+4*(c||0)+9*(f||0);if(kcal==null)return null;
 return{kcal:Math.round(kcal*10)/10,p:p||0,c:c||0,f:f||0}}
function offToFood(p){const n=offNutr(p.nutriments);if(!n)return null;
 const sg=parseFloat(p.serving_quantity)||0;const brand=Array.isArray(p.brands)?p.brands.join(', '):(p.brands||'');
 return{key:'o:'+p.code,code:p.code,name:(p.product_name||p.product_name_en||'Unnamed product').trim(),brand,per:'100g',n,serv:sg?{g:sg,label:(p.serving_size||sg+' g').trim()}:{g:100,label:'100 g'},noServ:!sg||undefined,off:true}}
async function fetchJSON(url,ms=12000){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function offSearch(q){const F='code,product_name,product_name_en,brands,nutriments,serving_quantity,serving_size';
 const cgi=h=>`https://${h}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&fields=${F}`;
 const urls=[cgi('world.openfoodfacts.org'),`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&page_size=25&fields=${F}`,cgi('world.openfoodfacts.net')];// .net mirror = fallback when the main site is overloaded
 let lastErr;for(const u of urls){try{const d=await fetchJSON(u);const arr=(d.hits||d.products||[]).map(offToFood).filter(Boolean);return arr}catch(e){lastErr=e}}throw lastErr}
// One product by barcode → {food} | {partial:{name,brand}} (exists, no nutrition) | null (not in OFF)
async function offProduct(code){const u=h=>`https://${h}/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_en,brands,nutriments,serving_quantity,serving_size`;let d;
 try{d=await fetchJSON(u('world.openfoodfacts.org'))}catch(e){if(/404/.test(e.message))return null;d=await fetchJSON(u('world.openfoodfacts.net'))}
 if(!d||d.status===0||!d.product)return null;d.product.code=d.product.code||code;const food=offToFood(d.product);
 return food?{food}:{partial:{name:(d.product.product_name||d.product.product_name_en||'this product').trim(),brand:Array.isArray(d.product.brands)?d.product.brands.join(', '):(d.product.brands||'')}}}
async function offBarcode(code){const r=await offProduct(code);return r&&r.food||null}

// ===== Barcode scanning (camera → BarcodeDetector or vendored ZXing → Open Food Facts)
// --- pure helpers (unit-tested via MT)
function gtinCheck(body){let s=0;for(let i=body.length-1,w=3;i>=0;i--,w=4-w)s+=(+body[i])*w;return(10-s%10)%10}
const validGTIN=c=>/^\d{8,14}$/.test(c)&&gtinCheck(c.slice(0,-1))===+c.slice(-1);
// UPC-E (8 digits, number system 0/1) → UPC-A (12 digits)
function upceToUpca(e){if(!/^[01]\d{7}$/.test(e))return null;const ns=e[0],m=e.slice(1,7),ck=e[7],l=+m[5];let body;
 if(l<=2)body=m[0]+m[1]+m[5]+'0000'+m[2]+m[3]+m[4];else if(l===3)body=m[0]+m[1]+m[2]+'00000'+m[3]+m[4];else if(l===4)body=m[0]+m[1]+m[2]+m[3]+'00000'+m[4];else body=m.slice(0,5)+'0000'+m[5];
 const a=ns+body+ck;return validGTIN(a)?a:null}
const validCode=c=>[8,12,13].includes(c.length)&&(validGTIN(c)||(c.length===8&&!!upceToUpca(c)));
function normCode(raw){let d=String(raw==null?'':raw).replace(/\D/g,'');if(d.length===14&&d[0]==='0')d=d.slice(1);return validCode(d)?d:null}
// Equivalent codes to try (OFF stores UPC-A as 13-digit EAN with a leading 0; UPC-E needs expanding)
function barcodeVariants(c){const out=[c];
 if(c.length===12)out.push('0'+c);if(c.length===13&&c[0]==='0')out.push(c.slice(1));
 if(c.length===8){const a=upceToUpca(c);if(a)out.push(a,'0'+a)}
 return out.filter((x,i)=>out.indexOf(x)===i)}
function mealByTime(d=new Date()){const h=d.getHours()+d.getMinutes()/60;return h<10.5?'breakfast':h<15?'lunch':h<20.5?'dinner':'snacks'}
function netErrMsg(e){if(navigator.onLine===false)return"You're offline. Connect to look this barcode up, or create a custom food now.";
 if(e&&e.name==='AbortError')return'Open Food Facts timed out. Try again in a moment.';return"Couldn't reach Open Food Facts"+(e&&e.message?' ('+e.message+')':'')+'.'}

// --- local barcode cache: products you've looked up keep working offline
function rememberBarcode(code,food){S.barcodes=S.barcodes||{};const f=Object.assign({},food);for(const c of new Set([code,food.code].filter(Boolean))){delete S.barcodes[c];S.barcodes[c]=f}
 const ks=Object.keys(S.barcodes);ks.slice(0,Math.max(0,ks.length-250)).forEach(k=>delete S.barcodes[k]);save()}
function cachedBarcode(code){for(const v of barcodeVariants(code)){const c=S.customFoods.find(f=>f.barcode&&barcodeVariants(f.barcode).includes(v));if(c)return{food:c,src:'mine'};const f=S.barcodes&&S.barcodes[v];if(f)return{food:f,src:'saved'}}return null}
async function lookupBarcode(code){const hit=cachedBarcode(code);if(hit)return hit;
 if(navigator.onLine===false)throw Object.assign(new Error('offline'),{offline:true});
 let partial=null;for(const v of barcodeVariants(code)){const r=await offProduct(v);if(r&&r.food){rememberBarcode(code,r.food);return{food:r.food,src:'off'}}if(r&&r.partial&&!partial)partial=r.partial}
 return{notFound:true,partial}}

// --- camera
let SC=null,SP=null;const CAM={stream:null,loop:0,gen:0,starting:false,det:null,zx:null,last:null,cv:null};
const scanTop=()=>SHEETS.length>0&&SHEETS[SHEETS.length-1]===scanSheet;
function syncScanner(){if(scanTop()&&SC&&SC.state==='scan'&&!SC.camErr&&!document.hidden)camStart();else camStop()}
function camStop(){CAM.gen++;CAM.starting=false;clearTimeout(CAM.loop);CAM.loop=0;CAM.last=null;if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null}const v=$('#scanvid');if(v)v.srcObject=null}
function camErrMsg(e){const n=e&&e.name;
 if(n==='Insecure')return'The camera needs the app to be opened over https (the installed app is). Type the barcode below instead.';
 if(n==='NotAllowedError'||n==='SecurityError')return'Camera access was blocked. Allow it in iPhone Settings › Safari › Camera (or for this app), then try again, or type the barcode below.';
 if(n==='NotFoundError'||n==='OverconstrainedError')return'No camera found on this device. Type the barcode below.';
 if(n==='NotReadableError')return'The camera is busy in another app. Close it and tap Retry, or type the barcode below.';
 if(n==='EngineError')return'The barcode scanner failed to load. Type the barcode below.';
 return'Camera unavailable ('+(e&&e.message||n||'unknown error')+'). Type the barcode below.'}
async function camStart(){const v=$('#scanvid');if(!v)return;
 if(CAM.stream){if(v.srcObject!==CAM.stream){v.srcObject=CAM.stream;v.play().catch(()=>{})}if(!CAM.loop)scanLoop();return}
 if(CAM.starting)return;CAM.starting=true;const g=CAM.gen;
 try{if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw{name:'Insecure'};
  const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  if(g!==CAM.gen){st.getTracks().forEach(t=>t.stop());return}
  CAM.stream=st;CAM.starting=false;
  try{await initDetector()}catch(e){throw{name:'EngineError',message:e&&e.message}}
  if(g!==CAM.gen)return;scanStatus(CAM.det?'Point at the barcode':'Point at the barcode · hold steady');camStart()}
 catch(e){if(g!==CAM.gen)return;CAM.starting=false;if(SC){SC.camErr=camErrMsg(e);renderSheets()}}}
function loadZXing(){if(window.ZXing)return Promise.resolve();if(CAM.zxp)return CAM.zxp;
 return CAM.zxp=new Promise((res,rej)=>{const s=document.createElement('script');s.src='vendor/zxing.min.js';s.onload=()=>window.ZXing?res():rej(new Error('ZXing missing'));s.onerror=()=>{CAM.zxp=null;s.remove();rej(new Error('could not load vendor/zxing.min.js'))};document.head.appendChild(s)})}
async function initDetector(){if(CAM.det||CAM.zx)return;
 if('BarcodeDetector' in window){try{const fm=await BarcodeDetector.getSupportedFormats();const want=['ean_13','ean_8','upc_a','upc_e'].filter(f=>fm.includes(f));if(want.length){CAM.det=new BarcodeDetector({formats:want});return}}catch(e){}}
 await loadZXing();const Z=window.ZXing,H=new Map();H.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);H.set(Z.DecodeHintType.TRY_HARDER,true);
 const r=new Z.MultiFormatReader();r.setHints(H);CAM.zx=r}
function scanStatus(t){const el=$('#scanst');if(el)el.textContent=t}
function detectZX(v){const vw=v.videoWidth,vh=v.videoHeight;const sw=vw*0.9,sh=vh*0.6,sc=Math.min(1,800/sw);
 const cv=CAM.cv||(CAM.cv=document.createElement('canvas'));cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);
 const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,cv.width,cv.height);
 const Z=window.ZXing;try{return CAM.zx.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){return null}}
async function detectNative(v){const r=await CAM.det.detect(v);for(const x of r){if(normCode(x.rawValue))return x.rawValue}return null}
function scanLoop(){const g=CAM.gen;CAM.loop=setTimeout(async()=>{const v=$('#scanvid');if(g!==CAM.gen||!CAM.stream||!v)return;let raw=null;
  if(v.readyState>=2&&v.videoWidth){try{raw=CAM.det?await detectNative(v):detectZX(v)}catch(e){}}
  if(g!==CAM.gen)return;const code=normCode(raw);
  if(code&&code===CAM.last){onScanCode(code);return}CAM.last=code||CAM.last;scanLoop()},CAM.det?120:160)}
function onScanCode(code){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}scanLookup(code)}
async function scanLookup(code){const sc=SC;sc.code=code;sc.state='busy';sc.msg='';sc.partial=null;renderSheets();let r;
 try{r=await lookupBarcode(code)}catch(e){if(SC!==sc)return;sc.state='error';sc.msg=netErrMsg(e);renderSheets();return}
 if(SC!==sc||!SHEETS.includes(scanSheet))return;
 if(r.food){sc.state='scan';sc.code=null;if(U.pick)U.pick.meal=sc.meal;if(r.food.per==='100g')openScanProduct(r.food,r.src);else openFoodSheet(r.food);if(r.src!=='off')toast('Loaded from your saved foods');return}
 sc.state='notfound';sc.partial=r.partial;renderSheets()}

// --- sheets
function openScanner(meal){meal=meal||mealByTime();const inPicker=SHEETS.length&&U.pick&&U.pick.mode==='log';const day=inPicker?U.pick.day:U.day;
 if(!inPicker)U.pick={mode:'log',meal,day};SC={meal,day,state:'scan',code:null,msg:'',camErr:''};openSheet(scanSheet)}
function scanSheet(){const s=SC;let body;
 if(s.state==='busy')body=`<div class="card c"><div class="b">Looking up ${esc(s.code)}…</div><div class="sm mut">Open Food Facts</div></div>`;
 else if(s.state==='notfound')body=`<div class="card"><h2>🤷 Not found</h2><p class="sm mut" style="margin:0 0 10px">${s.partial?`Open Food Facts has <b style="color:var(--tx)">${esc(s.partial.name)}</b> (${esc(s.code)}) but no nutrition facts for it.`:`Barcode <b style="color:var(--tx)">${esc(s.code)}</b> isn't in Open Food Facts yet.`} Create it once from the label and future scans will find it.</p>
  <div class="row"><button class="btn grow" data-act="scanagain">Scan again</button><button class="btn pri grow" data-act="scancf">＋ Create custom food</button></div></div>`;
 else if(s.state==='error')body=`<div class="card"><h2>⚠️ Lookup failed</h2><p class="sm mut" style="margin:0 0 10px">${esc(s.msg)}</p>
  <button class="btn pri full" data-act="scanretry">Retry</button><div class="row" style="margin-top:8px"><button class="btn sm grow" data-act="scancf">＋ Custom food</button><button class="btn sm grow" data-act="quick" data-v="${s.meal}">⚡ Quick add</button></div><button class="link sm" style="margin-top:6px" data-act="scanagain">Scan a different barcode</button></div>`;
 else if(s.camErr)body=`<div class="card"><h2>📷 Camera</h2><p class="sm mut" style="margin:0 0 10px">${esc(s.camErr)}</p><button class="btn full" data-act="camretry">Retry camera</button></div>`;
 else body=`<div class="scanbox"><video id="scanvid" playsinline muted autoplay></video><div class="reticle"></div><div class="scanst" id="scanst">Starting camera…</div></div>`;
 return sheetHd('Scan barcode')+body+`<div class="card"><h2>Type the barcode</h2><div class="row"><input type="text" inputmode="numeric" pattern="[0-9]*" id="scancode" placeholder="UPC / EAN digits" class="grow" autocomplete="off"><button class="btn pri sm" data-act="scanlookup">Look up</button></div>
 <label class="f" style="margin:10px 0 0"><span>Log to</span><select data-in="scmeal">${MEALS.map(x=>`<option value="${x[0]}" ${s.meal===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label>
 <div class="sm mut" style="margin-top:6px">EAN-13, EAN-8, UPC-A and UPC-E. Product data from Open Food Facts (crowd-sourced; double-check the label).</div></div>`}
function openScanProduct(food,src){const sv=food.serv&&!food.noServ&&food.serv.g>0?food.serv:null;
 const sc=SC&&SHEETS.includes(scanSheet)?SC:null;
 SP={food,src,hasServ:!!sv,mode:'g',qty:sv?r1(sv.g):100,meal:sc?sc.meal:(U.pick&&U.pick.meal)||mealByTime(),day:sc?sc.day:(U.pick&&U.pick.day)||U.day};openSheet(spSheet)}
function spGrams(){return SP.mode==='g'?(+SP.qty||0):(+SP.qty||0)*SP.food.serv.g}
function spMacros(){return foodMacros(SP.food,spGrams(),'g')}
function spNote(){const f=SP.food;if(!SP.hasServ)return'No serving size listed. Enter grams from the label or a kitchen scale.';const sv=f.serv;
 return SP.mode==='g'?`≈ ${Math.round(spGrams()/sv.g*100)/100} serving(s) · 1 serving = ${esc(sv.label)}${/\bg\b/.test(sv.label)?'':' ('+r0(sv.g)+' g)'}`:`= ${r0(spGrams())} g · 1 serving = ${esc(sv.label)}`}
function spSheet(){const f=SP.food;const below=SHEETS.includes(scanSheet);
 return sheetHd(esc(f.name),`<button class="star" data-act="spfav" title="Favorite">${isFav(f.key)?'★':'☆'}</button>`)+`<div class="mut sm" style="margin:-8px 0 10px">${[f.brand,f.code||f.barcode,SP.src==='off'?'Open Food Facts':SP.src==='saved'?'saved on this device':''].filter(Boolean).map(esc).join(' · ')}</div>
 <div class="card"><h2>Per 100 g</h2><div class="grid4">${macroStats(f.n)}</div></div>
 <div class="card"><div class="row" style="align-items:flex-end;gap:10px"><label class="f grow" style="margin:0"><span>Amount eaten</span><input type="number" inputmode="decimal" step="any" id="spqty" data-in="spqty" value="${esc(SP.qty)}"></label>
 ${SP.hasServ?`<div class="seg" style="margin-bottom:2px"><button data-act="spunit" data-v="g" class="${SP.mode==='g'?'on':''}">grams</button><button data-act="spunit" data-v="serv" class="${SP.mode==='serv'?'on':''}">servings</button></div>`:'<span class="mut b" style="padding-bottom:10px">g</span>'}</div>
 <div class="sm mut" id="spnote" style="margin:6px 0 10px">${spNote()}</div>
 <label class="f"><span>Meal</span><select data-in="spmeal">${MEALS.map(x=>`<option value="${x[0]}" ${SP.meal===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label>
 <div class="sm b" style="margin-bottom:6px">You'll log${SP.day!==today()?' on '+esc(fmtDay(SP.day)):''}</div><div class="grid4" id="spmac">${macroStats(spMacros())}</div></div>
 <div class="row">${below?'<button class="btn" data-act="spadd" data-v="next">Add & scan next</button>':''}<button class="btn pri grow" data-act="spadd">Add to log</button></div>`}
function spRefresh(){const m=$('#spmac'),n=$('#spnote');if(m)m.innerHTML=macroStats(spMacros());if(n)n.innerHTML=spNote()}
function spEntry(){const f=SP.food,m=spMacros();return{id:uid(),key:f.key,name:f.name,qty:+SP.qty,unit:SP.mode==='g'?'g':'serv',servLabel:f.serv&&f.serv.label,g:spGrams(),kcal:m.kcal,p:m.p,c:m.c,f:m.f}}
document.addEventListener('visibilitychange',()=>{if(SC)syncScanner()});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='scancode'){ev.preventDefault();ACTIONS.scanlookup()}});

// ===== Training views
const fmtDur=ms=>{const m=Math.floor(ms/60000);return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+' min'};
const activeProg=()=>S.train.programs.find(p=>p.id===S.train.activeProg)||null;
function nextDayIdx(p){const last=S.train.sessions.filter(s=>s.progId===p.id).sort((a,b)=>b.start-a.start)[0];return last?(last.dayIdx+1)%p.days.length:0}
function setStr(x){return `${dispW(x.w||0)}×${x.r}${x.rir!==''&&x.rir!=null?' @'+x.rir:''}`}
function exSummary(e){const ws=e.sets.filter(s=>s.done&&!s.warm);if(!ws.length)return'';const same=ws.every(s=>s.w===ws[0].w&&s.r===ws[0].r);return same?`${ws.length}×${ws[0].r} @ ${dispW(ws[0].w||0)} ${wu()}`:ws.map(setStr).join(', ')}
function vWorkout(){const A=S.train.active;if(A)return vLive(A);
 const p=activeProg();let h='';
 if(p){const ni=nextDayIdx(p);const d=p.days[ni];
  h+=`<div class="card"><div class="sm mut">${esc(p.name)} · next up</div><h2 style="font-size:20px;margin:4px 0 8px">${esc(d.name)}</h2>
  <div class="sm mut" style="margin-bottom:10px">${d.items.map(i=>esc(exById(i.exId).name)).join(' · ')}</div>
  <button class="btn pri full" data-act="startday" data-d="${ni}">▶ Start ${esc(d.name)}</button>
  <div class="chips" style="margin-top:10px">${p.days.map((x,i)=>i===ni?'':`<button class="chip" data-act="startday" data-d="${i}">${esc(x.name)}</button>`).join('')}</div></div>`}
 else h+=`<div class="card"><h2>No program yet</h2><p class="mut sm" style="margin-top:0">Pick a template (Push/Pull/Legs, Upper/Lower, Full Body) or build your own.</p><button class="btn pri full" data-act="tab" data-v="programs">Choose a program</button></div>`;
 h+=`<button class="btn full" data-act="startempty" style="margin-bottom:12px">＋ Start empty workout</button>`;
 const wk=weekStart(today());const n=S.train.sessions.filter(s=>dkey(s.start)>=wk).length;const ss=S.train.sessions.slice().sort((a,b)=>b.start-a.start);
 h+=`<div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px"><div class="stat"><b>${n}</b><span>workouts this week</span></div><div class="stat"><b>${S.train.sessions.length}</b><span>total workouts</span></div><div class="stat"><b>${ss.reduce((a,s)=>a+(s.prs||[]).length,0)}</b><span>PRs set</span></div></div>`;
 if(ss[0]){const s=ss[0];h+=`<div class="card"><h2>Last workout<span class="sp"></span><span class="sm mut">${fmtDay(dkey(s.start))}</span></h2><div class="b">${esc(s.name)}</div><div class="sm mut">${s.exs.map(e=>esc(exById(e.exId).name)+' '+exSummary(e)).join('<br>')}</div></div>`}
 h+=vSuggested();
 return h}
function vLive(A){let h=`<div class="card"><div class="row"><div class="grow"><div class="b" style="font-size:17px">${esc(A.name)}</div><div class="sm mut">⏱ <span id="elapsed">${fmtDur(Date.now()-A.start)}</span> · ${A.exs.reduce((a,e)=>a+e.sets.filter(s=>s.done&&!s.warm).length,0)} sets done</div></div>
 <button class="btn sm bad" data-act="discard">Discard</button><button class="btn sm ok" data-act="finish">Finish</button></div></div>`;
 A.exs.forEach((e,ei)=>{const ex=exById(e.exId);const sg=suggestNext(e.exId,e.repMin,e.repMax,e.nSets);const H=exHistory(e.exId);const prev=H.length?workSets(H[H.length-1],e.exId):[];
  let wi=0;
  h+=`<div class="card"><h2><span class="grow">${esc(ex.name)}</span><button class="link sm" data-act="howto" data-v="${e.exId}">▶ How to</button><button class="link sm" data-act="warmups" data-e="${ei}">🔥 Warm-ups</button><button class="link bad" data-act="rmex" data-e="${ei}" aria-label="Remove">✕</button></h2>
  <div class="sm mut" style="margin-top:-6px">${ex.m} · ${ex.eq} · target ${e.repMin}–${e.repMax} ${isTimed(ex)?'sec':'reps'} · rest ${Math.round(e.rest/60*10)/10} min</div>
  <div class="sugg">${sg.w!=null?`Suggested: <b>${dispW(sg.w)} ${wu()} × ${sg.reps}</b> · `:'<b>Suggested:</b> '}${esc(sg.text)}</div>
  <table class="sets"><colgroup><col style="width:30px"><col style="width:66px"><col><col><col style="width:54px"><col style="width:42px"></colgroup><tr><th>Set</th><th>Previous</th><th>${wu()}</th><th>${isTimed(ex)?'Sec':'Reps'}</th><th>RIR</th><th></th></tr>`+
  e.sets.map((s,si)=>{const p=s.warm?null:prev[wi];const lbl=s.warm?'W':String(++wi);
   const phW=s.warm?'':(sg.w!=null?dispW(sg.w):'');const phR=s.warm?'':sg.reps;
   return`<tr class="${s.done?'done':''} ${s.warm?'warm':''}"><td>${lbl}</td><td class="sm mut">${p?dispW(p.w||0)+'×'+p.r:'—'}</td>
   <td><input type="number" inputmode="decimal" step="any" data-in="set" data-e="${ei}" data-s="${si}" data-k="w" value="${s.w!=null?dispW(s.w):''}" placeholder="${phW}"></td>
   <td><input type="number" inputmode="numeric" data-in="set" data-e="${ei}" data-s="${si}" data-k="r" value="${s.r!=null?s.r:''}" placeholder="${phR}"></td>
   <td><select data-in="set" data-e="${ei}" data-s="${si}" data-k="rir"><option value="">–</option>${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${String(s.rir)===String(v)?'selected':''}>${v}${v===5?'+':''}</option>`).join('')}</select></td>
   <td><button class="chk" data-act="setdone" data-e="${ei}" data-s="${si}" aria-label="Complete set">✓</button></td></tr>`}).join('')+
  `</table><div class="row" style="margin-top:6px"><button class="link" data-act="addset" data-e="${ei}">＋ Add set</button><span class="grow"></span>${e.sets.length?`<button class="link sm mut" data-act="rmset" data-e="${ei}">− Remove last</button>`:''}</div></div>`});
 h+=`<button class="btn full" data-act="addex" style="margin-bottom:12px">＋ Add exercise</button><div class="sm mut c">RIR = reps in reserve (0 = failure). Tap ✓ to log a set and start the rest timer; empty fields use the suggestion.</div>`;

function newSessionFrom(name,items,progId,dayIdx){
