<title>Macro &amp; Lift</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--card2:#f0f2f5;--tx:#14171c;--mut:#6b7280;--bd:#e3e6eb;--ac:#4f6bff;--ac2:#e9edff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
--kc:#4f6bff;--pr:#ef4444;--cb:#f59e0b;--ft:#10b981;--sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
:root.dark{--bg:#0f1115;--card:#181b21;--card2:#22262e;--tx:#e8eaed;--mut:#9aa1ad;--bd:#2b3039;--ac:#7b8cff;--ac2:#252b45;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.iconbtn{border:0;background:var(--card2);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px}
main{padding:12px 14px;max-width:640px;margin:0 auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:none;padding:8px 2px 9px;color:var(--mut);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button span{font-size:19px;line-height:1}
nav.bottom button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}.c{text-align:center}.r{text-align:right}
.btn{border:1px solid var(--bd);background:var(--card2);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%;display:block}
.btn:disabled{opacity:.5}
.link{border:0;background:none;color:var(--ac);font-weight:600;cursor:pointer;padding:4px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:5px 11px;white-space:nowrap;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.list .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
.list .it:first-child{border-top:0}
.it .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--ac2);color:var(--ac)}
.pill.pr{background:#fde68a;color:#92400e}
.pill.ok{background:#dcfce7;color:#166534}
.ringwrap{display:flex;align-items:center;gap:16px}
.bars{flex:1;display:flex;flex-direction:column;gap:9px}
.bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px}
.mtot{font-size:12.5px;color:var(--mut);white-space:nowrap}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.daynav b{font-size:16px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2}
.sheet .hd h3{flex:1;margin:0;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:600;font-size:14px;max-width:90%;text-align:center}
.stat{background:var(--card2);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:11.5px;color:var(--mut)}
table.sets{width:100%;border-collapse:collapse;table-layout:fixed}
table.sets th{font-size:11px;color:var(--mut);font-weight:700;text-align:center;padding:3px}
table.sets td{padding:3px;text-align:center}
table.sets input,table.sets select{padding:7px 2px;text-align:center;border-radius:8px}
table.sets select{appearance:none;-webkit-appearance:none;text-align-last:center}
table.sets tr.done td{background:rgba(22,163,74,.12)}
table.sets tr.warm td:first-child{color:var(--warn);font-weight:700}
.chk{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--card2);cursor:pointer;font-weight:800}
tr.done .chk{background:var(--ok);color:#fff;border-color:var(--ok)}
.sugg{background:var(--ac2);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0 8px}
.sugg b{color:var(--ac)}
#restbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:30;display:none;justify-content:center}
#restbar .in{background:var(--tx);color:var(--bg);border-radius:14px;margin:0 10px;padding:8px 10px;display:flex;align-items:center;gap:8px;width:100%;max-width:620px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#restbar .t{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-width:62px}
#restbar .pb{flex:1;height:6px;background:rgba(127,127,127,.35);border-radius:4px;overflow:hidden}
#restbar .pb i{display:block;height:100%;background:var(--ac)}
#restbar button{border:0;border-radius:8px;padding:6px 9px;font-weight:700;background:rgba(127,127,127,.3);color:inherit;cursor:pointer}
.vol .vr{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.vol .track{position:relative;height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.vol .track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.vol .zone{position:absolute;top:0;bottom:0;border-left:1px dashed var(--mut);border-right:1px dashed var(--mut);opacity:.6}
svg text{fill:var(--mut);font-size:10px}
.empty{color:var(--mut);text-align:center;padding:18px 6px}
.ob{max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
.ob h2{font-size:22px;margin:10px 0 4px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);padding:11px 12px;border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--ac);background:var(--ac2)}
.opt small{display:block;color:var(--mut)}
.star{border:0;background:none;font-size:20px;cursor:pointer;color:var(--warn)}
hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
</style>
</head>

// ===== Nutrition math
function bmr(p){return 10*p.weightKg+6.25*p.heightCm-5*p.age+(p.sex==='male'?5:-161)}
function formulaTDEE(p){return bmr(p)*p.activity}
function goalDelta(p){const k=(p.rateKg||0)*KCAL_PER_KG/7;return p.goal==='lose'?-k:p.goal==='gain'?k:0}
function kcalFloor(p){return p.sex==='male'?1500:1200}
function macrosFor(kcal,p){
 const kg=p.weightKg;let prot=p.goal==='lose'?2.2*kg:1.8*kg;           // g/kg bodyweight
 prot=Math.min(prot,kcal*0.4/4);
 const fat=Math.max(kcal*0.28/9,0.6*kg*0.8);
 const carbs=Math.max(0,(kcal-prot*4-fat*9)/4);
 return{kcal:r0(kcal),p:r0(prot),c:r0(carbs),f:r0(fat)}}
function calcTargets(p,tdee){const t=tdee||formulaTDEE(p);const kcal=Math.max(kcalFloor(p),t+goalDelta(p));return macrosFor(kcal,p)}
function foodMacros(food,qty,unit){
 let f;if(unit==='g'){f=food.per==='100g'?qty/100:(food.serv&&food.serv.g?qty/food.serv.g:0)}else{f=food.per==='100g'?qty*(food.serv?food.serv.g:100)/100:qty}
 return{kcal:food.n.kcal*f,p:food.n.p*f,c:food.n.c*f,f:food.n.f*f}}
function sumEntries(arr){return arr.reduce((a,e)=>({kcal:a.kcal+(+e.kcal||0),p:a.p+(+e.p||0),c:a.c+(+e.c||0),f:a.f+(+e.f||0)}),{kcal:0,p:0,c:0,f:0})}
function dayLog(k,create){if(!S.logs[k]){if(!create)return{breakfast:[],lunch:[],dinner:[],snacks:[]};S.logs[k]={breakfast:[],lunch:[],dinner:[],snacks:[]}}return S.logs[k]}
function dayTotals(k){const L=dayLog(k);return sumEntries([].concat(...MEALS.map(m=>L[m[0]]||[])))}
function dayHasLog(k){const L=S.logs[k];return !!L&&MEALS.some(m=>(L[m[0]]||[]).length)}
// Weight trend: exponentially smoothed moving average (alpha 0.1/day, adjusted for gaps)
function weightTrend(){
 const ks=Object.keys(S.weights).sort();const out=[];let t=null,prev=null;
 for(const k of ks){const w=S.weights[k];if(t==null)t=w;else{const g=Math.max(1,dayDiff(prev,k));const a=1-Math.pow(0.9,g);t=t+a*(w-t)}out.push({d:k,w,t});prev=k}
 return out}
function trendAt(tr,k){let v=null;for(const p of tr){if(p.d<=k)v=p;else break}return v}
// Adaptive expenditure check-in
function computeCheckin(endKey){
 endKey=endKey||today();const p=S.profile;const start=addDays(endKey,-20);
 const tr=weightTrend();const inWin=tr.filter(x=>x.d>=start&&x.d<=endKey);
 const res={ok:false,start,end:endKey,formula:r0(formulaTDEE(p)),prior:r0(S.tdeeEst||formulaTDEE(p))};
 if(inWin.length<2){res.reason='Log your weight at least a few times a week (need 2+ weigh-ins in the last 3 weeks).';return res}
 const a=inWin[0],b=inWin[inWin.length-1];const span=dayDiff(a.d,b.d);
 let days=0,kc=0;for(let k=a.d;k<=b.d;k=addDays(k,1)){if(dayHasLog(k)){days++;kc+=dayTotals(k).kcal}}
 res.loggedDays=days;res.span=span;
 if(span<10){res.reason=`Need weigh-ins spanning at least 10 days (currently ${span}).`;return res}
 if(days<Math.max(7,span*0.6)){res.reason=`Need food logged on most days (${days} of ${span+1} days logged).`;return res}
 const avg=kc/days;const dT=b.t-a.t;const observed=avg-dT*KCAL_PER_KG/span;
 const fT=formulaTDEE(p);const obsC=clamp(observed,fT*0.6,fT*1.6);
 const est=res.prior*0.3+obsC*0.7;// smooth toward observation
 const p2=Object.assign({},p,{weightKg:b.t});
 Object.assign(res,{ok:true,avgIntake:r0(avg),trendStart:a.t,trendEnd:b.t,trendChange:dT,weeklyRate:dT/span*7,observed:r0(observed),estimate:r0(est),suggested:calcTargets(p2,est)});
 return res}

// ===== Training math
const exById=id=>EXERCISES.find(e=>e.id===id)||S.train.custom.find(e=>e.id===id)||{id,name:id,m:'Other',eq:'Other',t:'i'};
const allEx=()=>EXERCISES.concat(S.train.custom);
const e1rm=(w,r)=>r<=0?0:r===1?w:w*(1+r/30);// Epley
const isTimed=ex=>/seconds/i.test(ex.name);
function incKg(ex){const lower=['Quads','Hamstrings','Glutes'].includes(ex.m);
 if(isLb()){const lb=(ex.eq==='Barbell'&&lower&&ex.t==='c')?10:5;return lb/2.2046226}
 return (ex.eq==='Barbell'&&lower&&ex.t==='c')?5:ex.eq==='Dumbbell'?2:2.5}
function roundStep(ex){return isLb()?(ex.eq==='Dumbbell'||ex.eq==='Barbell'?5:2.5)/2.2046226:(ex.eq==='Dumbbell'?1:2.5)}
const roundW=(kg,ex)=>{const s=roundStep(ex);return Math.round(kg/s)*s};
function workSets(sess,exId){const e=sess.exs.find(x=>x.exId===exId);return e?e.sets.filter(s=>!s.warm&&s.done&&s.r>0):[]}
function exHistory(exId){return S.train.sessions.filter(s=>workSets(s,exId).length).sort((a,b)=>a.start-b.start)}
// Double progression: work inside repMin–repMax; once every working set hits repMax, add weight and drop to repMin.
function suggestNext(exId,repMin,repMax,nSets){
 const ex=exById(exId);const H=exHistory(exId);
 if(!H.length)return{kind:'new',w:null,reps:repMax,text:`First time: pick a weight you could lift for about ${repMax+2} reps, then do ${repMax} (2–3 reps in reserve).`};
 const last=workSets(H[H.length-1],exId);const topW=Math.max(...last.map(s=>s.w||0));
 const top=last.filter(s=>(s.w||0)===topW);const minR=Math.min(...top.map(s=>s.r));
 const rirs=top.map(s=>s.rir).filter(x=>x!==''&&x!=null&&!isNaN(x)).map(Number);const avgRir=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
 const enoughSets=!nSets||last.length>=nSets;
 const inc=incKg(ex);
 if(minR>=repMax&&enoughSets){
  if(topW===0)return{kind:'up',w:0,reps:repMax,text:`Hit ${repMax}+ reps on every set. Add load (e.g. ${dispW(inc)} ${wu()}) or move to a harder variation.`};
  const mult=avgRir!=null&&avgRir>=3?2:1;const nw=roundW(topW+inc*mult,ex)||topW+inc*mult;
  return{kind:'up',w:nw,reps:repMin,text:`Hit ${repMax} reps on all sets last time${mult>1?' with 3+ RIR':''} → add weight, reset to ${repMin} reps.`}}
 if(minR<repMin){
  const prev=H.length>1?workSets(H[H.length-2],exId):[];const prevMiss=prev.length&&Math.max(...prev.map(s=>s.w||0))===topW&&Math.min(...prev.filter(s=>s.w===topW).map(s=>s.r))<repMin;
  if(prevMiss&&topW>0)return{kind:'deload',w:roundW(topW*0.9,ex),reps:repMin,text:`Missed ${repMin} reps two sessions in a row → back off ~10% and build up again.`};
  return{kind:'hold',w:topW,reps:repMin,text:`Fell short of ${repMin} reps → keep the weight and aim for ${repMin} on every set.`}}
 const target=Math.min(repMax,minR+1);
 return{kind:'reps',w:topW,reps:target,text:`In range (${minR}–${Math.max(...top.map(s=>s.r))} reps) → same weight, aim for ${target}+ reps per set.`}}
function warmups(ex,workKg){
 if(!workKg||workKg<=0)return[];const out=[];const bar=isLb()?45/2.2046226:20;
 const sch=ex.t==='c'?[[0,10],[0.5,5],[0.7,3],[0.85,1]]:[[0.5,10]];
 for(const [pct,r] of sch){let w;if(pct===0){if(ex.eq!=='Barbell')continue;w=bar}else w=roundW(workKg*pct,ex);
  if(ex.eq==='Barbell'&&w<bar)w=bar;if(w>=workKg-0.01)continue;if(out.length&&Math.abs(out[out.length-1].w-w)<0.01)continue;if(pct===0.85&&workKg<(isLb()?135:60)/(isLb()?2.2046226:1))continue;out.push({w,r})}
 return out}
function sessionVolume(s){let v=0;for(const e of s.exs)for(const x of e.sets)if(x.done&&!x.warm)v+=(x.w||0)*(x.r||0);return v}
function bestOf(exId,before){let b={e1:0,w:0,r:0,set:null};for(const s of S.train.sessions){if(before&&s.start>=before)continue;for(const x of workSets(s,exId)){const e=e1rm(x.w||0,x.r);if(e>b.e1){b.e1=e;b.set=x}if((x.w||0)>b.w)b.w=x.w||0;if(x.r>b.r)b.r=x.r}}return b}
function weeklyMuscleSets(wkStart){const end=addDays(wkStart,7);const m={};MUSCLES.forEach(x=>m[x]=0);
 for(const s of S.train.sessions){const k=dkey(s.start);if(k<wkStart||k>=end)continue;for(const e of s.exs){const ex=exById(e.exId);const n=e.sets.filter(x=>x.done&&!x.warm).length;if(!n)continue;m[ex.m]=(m[ex.m]||0)+n;(SECONDARY[e.exId]||[]).forEach(sm=>m[sm]=(m[sm]||0)+n*0.5)}}
 return m}

// ===== Charts (inline SVG, no libraries)
function lineChart(o){
 const W=o.w||340,H=o.h||170,P={l:36,r:8,t:10,b:20};const all=o.series.flatMap(s=>s.pts);if(!all.length)return'<div class="empty">No data yet</div>';
 let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0]));if(x0===x1){x0-=1;x1+=1}
 let ys=all.map(p=>p[1]).concat(o.extraY||[]);let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*0.12||Math.max(1,Math.abs(y1)*0.05);y0-=pad;y1+=pad;
 const X=x=>P.l+(x-x0)/(x1-x0)*(W-P.l-P.r),Y=y=>P.t+(1-(y-y0)/(y1-y0))*(H-P.t-P.b);
 let g='';for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${P.l-4}" y="${Y(v)+3}" text-anchor="end">${o.yFmt?o.yFmt(v):r0(v)}</text>`}
 const xt=o.xTicks||[x0,(x0+x1)/2,x1];xt.forEach((x,i)=>g+=`<text x="${X(x)}" y="${H-5}" text-anchor="${i===0?'start':i===xt.length-1?'end':'middle'}">${o.xFmt?o.xFmt(x):x}</text>`);
 (o.hlines||[]).forEach(h=>g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="${h.color}" stroke-dasharray="4 3"/>`);
 for(const s of o.series){if(!s.pts.length)continue;
  if(s.line!==false&&s.pts.length>1)g+=`<polyline fill="none" stroke="${s.color}" stroke-width="${s.width||2.5}" stroke-linejoin="round" stroke-linecap="round" points="${s.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;
  if(s.dots)s.pts.forEach(p=>g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${s.r||2.6}" fill="${s.color}" opacity="${s.op||1}"/>`)}
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`}
function barChart(o){const W=o.w||340,H=o.h||150,P={l:34,r:6,t:8,b:20};const n=o.vals.length;if(!n)return'';
 const ymax=Math.max(...o.vals.map(v=>v.y),o.target||0)*1.1||1;const bw=(W-P.l-P.r)/n;const Y=y=>P.t+(1-y/ymax)*(H-P.t-P.b);let g='';
 for(let i=0;i<=2;i++){const v=ymax*i/2;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${P.l-4}" y="${Y(v)+3}" text-anchor="end">${v>=10000?r0(v/1000)+'k':r0(v)}</text>`}
 o.vals.forEach((v,i)=>{const x=P.l+i*bw;g+=`<rect x="${(x+bw*0.15).toFixed(1)}" y="${Y(v.y).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${Math.max(0,H-P.b-Y(v.y)).toFixed(1)}" rx="2" fill="${v.color||'var(--ac)'}" opacity="${v.y?1:.25}"/>`;if(v.lbl)g+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${v.lbl}</text>`});
 if(o.target)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(o.target)}" y2="${Y(o.target)}" stroke="var(--warn)" stroke-dasharray="4 3"/>`;
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`}
function ring(val,target,color,size=118,label){const R=size/2-9,C=2*Math.PI*R;const pct=target?Math.min(1,val/target):0;const over=target&&val>target;
 return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--card2)" stroke-width="11"/>
 <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${over?'var(--bad)':color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
 <text x="50%" y="46%" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--tx)">${r0(Math.abs(target-val))}</text><text x="50%" y="62%" text-anchor="middle" style="font-size:11px">${label||(over?'kcal over':'kcal left')}</text></svg>`}
function macroBar(name,val,target,color){const pct=target?Math.min(100,val/target*100):0;const over=val>target*1.05;
 return`<div><div class="row sm"><b class="grow">${name}</b><span class="${over?'':'mut'}" style="${over?'color:var(--bad)':''}">${r0(val)} / ${r0(target)} g · ${over?r0(val-target)+' over':r0(target-val)+' left'}</span></div><div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`}

 return{sex:OB.sex,age:+OB.age,heightCm,weightKg,activity:+OB.activity,goal:OB.goal,rateKg}}

 <label class="f"><span>Sex (for the BMR formula)</span><div class="seg"><button data-act="ob" data-k="sex" data-v="female" class="${OB.sex==='female'?'on':''}">Female</button><button data-act="ob" data-k="sex" data-v="male" class="${OB.sex==='male'?'on':''}">Male</button></div></label>
 <div class="grid2"><label class="f"><span>Age</span><input type="number" inputmode="numeric" data-ob="age" value="${esc(OB.age)}"></label>
 <label class="f"><span>Weight (${lb?'lb':'kg'})</span><input type="number" inputmode="decimal" data-ob="w" value="${esc(OB.w)}" placeholder="${lb?'165':'75'}"></label></div>
 ${lb?`<div class="grid2"><label class="f"><span>Height (ft)</span><input type="number" data-ob="h1" value="${esc(OB.h1)}"></label><label class="f"><span>Height (in)</span><input type="number" data-ob="h2" value="${esc(OB.h2)}"></label></div>`:`<label class="f"><span>Height (cm)</span><input type="number" data-ob="h1" value="${esc(OB.h1)}"></label>`}</div>
 <button class="btn pri full" data-act="obnext">Next</button>`}
 else if(OB.step===1){h+=`<h2>Activity level</h2><p class="mut">Outside of structured training, how active are you overall?</p>`+ACT.map(a=>`<button class="opt ${+OB.activity===a[0]?'on':''}" data-act="ob" data-k="activity" data-v="${a[0]}"><b>${a[1]}</b> <span class="mut sm">×${a[0]}</span><small>${a[2]}</small></button>`).join('')+
 `<div class="row"><button class="btn" data-act="obback">Back</button><button class="btn pri grow" data-act="obnext">Next</button></div>`}
 else{const p=obProfile();const t=calcTargets(p);const tdee=r0(formulaTDEE(p));
 h+=`<h2>Your goal</h2>`+[['lose','Lose weight'],['maintain','Maintain'],['gain','Gain weight / build muscle']].map(g=>`<button class="opt ${OB.goal===g[0]?'on':''}" data-act="ob" data-k="goal" data-v="${g[0]}"><b>${g[1]}</b></button>`).join('')+
 (OB.goal!=='maintain'?`<div class="card"><b class="sm">Rate per week</b><div class="chips" style="margin-top:8px">${rates.map(r=>`<button class="chip ${+OB.rate===r?'on':''}" data-act="ob" data-k="rate" data-v="${r}">${r} ${lb?'lb':'kg'}</button>`).join('')}</div>
  <div class="sm mut" style="margin-top:6px">≈ ${r0(goalDelta(p))>0?'+':''}${r0(goalDelta(p))} kcal/day vs. maintenance${p.weightKg&&p.rateKg/p.weightKg>0.01?' · <span style="color:var(--warn)">over 1% of bodyweight/week is aggressive</span>':''}</div></div>`:'')+
 `<div class="card"><h2>Starting targets</h2><div class="grid4"><div class="stat"><b>${t.kcal}</b><span>kcal</span></div><div class="stat"><b style="color:var(--pr)">${t.p}g</b><span>protein</span></div><div class="stat"><b style="color:var(--cb)">${t.c}g</b><span>carbs</span></div><div class="stat"><b style="color:var(--ft)">${t.f}g</b><span>fat</span></div></div>
 <p class="sm mut" style="margin:8px 0 0">BMR ${r0(bmr(p))} kcal × ${p.activity} = estimated TDEE <b>${tdee}</b> kcal. You can edit targets any time in Settings; weekly check-ins will refine your expenditure from real data.</p></div>

 <div class="card"><div class="ringwrap">${ring(tot.kcal,T.kcal,'var(--kc)')}<div class="bars">${macroBar('Protein',tot.p,T.p,'var(--pr)')}${macroBar('Carbs',tot.c,T.c,'var(--cb)')}${macroBar('Fat',tot.f,T.f,'var(--ft)')}</div></div>

function pickerSheet(){const c=U.pick;const ttl=c.mode==='recipe'?'Add ingredient':'Add to '+MEALS.find(m=>m[0]===c.meal)[1];
 return sheetHd(esc(ttl))+`<input type="search" id="pickq" data-in="pickq" placeholder="Search foods (e.g. chicken, oats)…" value="${esc(U.pickQ)}" autocomplete="off">

 <div class="row wrap" style="margin-bottom:8px">${c.mode==='log'?`<button class="btn sm" data-act="quick" data-v="${c.meal}">⚡ Quick add</button>`:''}<button class="btn sm" data-act="newfood">＋ Custom food</button>${c.mode==='log'?`<button class="btn sm" data-act="newrecipe">＋ Recipe</button>`:''}</div>
 <div id="pickres">${pickerResults()}</div>`}
function pickerResults(){const q=U.pickQ.trim().toLowerCase();let arr;
 if(U.pickTab==='recent'&&!q)arr=S.recents;else if(U.pickTab==='fav')arr=S.favorites;else if(U.pickTab==='mine')arr=S.customFoods;else if(U.pickTab==='recipes')arr=S.recipes.map(recipeFood);

// Open Food Facts (CORS-enabled public API). Tries the new search service, then the classic endpoint.
function offToFood(p){const n=p.nutriments||{};let kcal=n['energy-kcal_100g'];if(kcal==null&&n['energy_100g']!=null)kcal=n['energy_100g']/4.184;if(kcal==null)return null;
 const sg=parseFloat(p.serving_quantity)||0;const brand=Array.isArray(p.brands)?p.brands.join(', '):(p.brands||'');
 return{key:'o:'+p.code,name:(p.product_name||p.product_name_en||'Unnamed product').trim(),brand,per:'100g',n:{kcal:+kcal||0,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0},serv:sg?{g:sg,label:p.serving_size||sg+' g'}:{g:100,label:'100 g'},off:true}}
async function fetchJSON(url,ms=12000){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function offSearch(q){const F='code,product_name,product_name_en,brands,nutriments,serving_quantity,serving_size';
 const cgi=h=>`https://${h}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&fields=${F}`;
 const urls=[cgi('world.openfoodfacts.org'),`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&page_size=25&fields=${F}`,cgi('world.openfoodfacts.net')];// .net mirror = fallback when the main site is overloaded
 let lastErr;for(const u of urls){try{const d=await fetchJSON(u);const arr=(d.hits||d.products||[]).map(offToFood).filter(Boolean);return arr}catch(e){lastErr=e}}throw lastErr}
async function offBarcode(code){const u=h=>`https://${h}/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_en,brands,nutriments,serving_quantity,serving_size`;let d;
 try{d=await fetchJSON(u('world.openfoodfacts.org'))}catch(e){if(/404/.test(e.message))return null;d=await fetchJSON(u('world.openfoodfacts.net'))}
 if(!d||d.status===0||!d.product)return null;d.product.code=d.product.code||code;return offToFood(d.product)}

 const days=[];for(let i=20;i>=0;i--){const k=addDays(today(),-i);const t=dayHasLog(k)?dayTotals(k).kcal:0;days.push({y:t,lbl:i%5===0?pd(k).getDate():'',color:t>T.kcal*1.05?'var(--warn)':'var(--ac)'})}

// ===== Training views
const fmtDur=ms=>{const m=Math.floor(ms/60000);return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+' min'};
const activeProg=()=>S.train.programs.find(p=>p.id===S.train.activeProg)||null;
function nextDayIdx(p){const last=S.train.sessions.filter(s=>s.progId===p.id).sort((a,b)=>b.start-a.start)[0];return last?(last.dayIdx+1)%p.days.length:0}
function setStr(x){return `${dispW(x.w||0)}×${x.r}${x.rir!==''&&x.rir!=null?' @'+x.rir:''}`}
function exSummary(e){const ws=e.sets.filter(s=>s.done&&!s.warm);if(!ws.length)return'';const same=ws.every(s=>s.w===ws[0].w&&s.r===ws[0].r);return same?`${ws.length}×${ws[0].r} @ ${dispW(ws[0].w||0)} ${wu()}`:ws.map(setStr).join(', ')}
function vWorkout(){const A=S.train.active;if(A)return vLive(A);
 const p=activeProg();let h='';
 if(p){const ni=nextDayIdx(p);const d=p.days[ni];
  h+=`<div class="card"><div class="sm mut">${esc(p.name)} · next up</div><h2 style="font-size:20px;margin:4px 0 8px">${esc(d.name)}</h2>
  <div class="sm mut" style="margin-bottom:10px">${d.items.map(i=>esc(exById(i.exId).name)).join(' · ')}</div>
  <button class="btn pri full" data-act="startday" data-d="${ni}">▶ Start ${esc(d.name)}</button>
  <div class="chips" style="margin-top:10px">${p.days.map((x,i)=>i===ni?'':`<button class="chip" data-act="startday" data-d="${i}">${esc(x.name)}</button>`).join('')}</div></div>`}
 else h+=`<div class="card"><h2>No program yet</h2><p class="mut sm" style="margin-top:0">Pick a template (Push/Pull/Legs, Upper/Lower, Full Body) or build your own.</p><button class="btn pri full" data-act="tab" data-v="programs">Choose a program</button></div>`;
 h+=`<button class="btn full" data-act="startempty" style="margin-bottom:12px">＋ Start empty workout</button>`;
 const wk=weekStart(today());const n=S.train.sessions.filter(s=>dkey(s.start)>=wk).length;const ss=S.train.sessions.slice().sort((a,b)=>b.start-a.start);
 h+=`<div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px"><div class="stat"><b>${n}</b><span>workouts this week</span></div><div class="stat"><b>${S.train.sessions.length}</b><span>total workouts</span></div><div class="stat"><b>${ss.reduce((a,s)=>a+(s.prs||[]).length,0)}</b><span>PRs set</span></div></div>`;
 if(ss[0]){const s=ss[0];h+=`<div class="card"><h2>Last workout<span class="sp"></span><span class="sm mut">${fmtDay(dkey(s.start))}</span></h2><div class="b">${esc(s.name)}</div><div class="sm mut">${s.exs.map(e=>esc(exById(e.exId).name)+' '+exSummary(e)).join('<br>')}</div></div>`}
 return h}
function vLive(A){let h=`<div class="card"><div class="row"><div class="grow"><div class="b" style="font-size:17px">${esc(A.name)}</div><div class="sm mut">⏱ <span id="elapsed">${fmtDur(Date.now()-A.start)}</span> · ${A.exs.reduce((a,e)=>a+e.sets.filter(s=>s.done&&!s.warm).length,0)} sets done</div></div>
 <button class="btn sm bad" data-act="discard">Discard</button><button class="btn sm ok" data-act="finish">Finish</button></div></div>`;
 A.exs.forEach((e,ei)=>{const ex=exById(e.exId);const sg=suggestNext(e.exId,e.repMin,e.repMax,e.nSets);const H=exHistory(e.exId);const prev=H.length?workSets(H[H.length-1],e.exId):[];
  let wi=0;
  h+=`<div class="card"><h2><span class="grow">${esc(ex.name)}</span><button class="link sm" data-act="warmups" data-e="${ei}">🔥 Warm-ups</button><button class="link bad" data-act="rmex" data-e="${ei}" aria-label="Remove">✕</button></h2>
  <div class="sm mut" style="margin-top:-6px">${ex.m} · ${ex.eq} · target ${e.repMin}–${e.repMax} ${isTimed(ex)?'sec':'reps'} · rest ${Math.round(e.rest/60*10)/10} min</div>
  <div class="sugg">${sg.w!=null?`Suggested: <b>${dispW(sg.w)} ${wu()} × ${sg.reps}</b> · `:'<b>Suggested:</b> '}${esc(sg.text)}</div>
  <table class="sets"><colgroup><col style="width:30px"><col style="width:66px"><col><col><col style="width:54px"><col style="width:42px"></colgroup><tr><th>Set</th><th>Previous</th><th>${wu()}</th><th>${isTimed(ex)?'Sec':'Reps'}</th><th>RIR</th><th></th></tr>`+
  e.sets.map((s,si)=>{const p=s.warm?null:prev[wi];const lbl=s.warm?'W':String(++wi);
   const phW=s.warm?'':(sg.w!=null?dispW(sg.w):'');const phR=s.warm?'':sg.reps;
   return`<tr class="${s.done?'done':''} ${s.warm?'warm':''}"><td>${lbl}</td><td class="sm mut">${p?dispW(p.w||0)+'×'+p.r:'—'}</td>
   <td><input type="number" inputmode="decimal" step="any" data-in="set" data-e="${ei}" data-s="${si}" data-k="w" value="${s.w!=null?dispW(s.w):''}" placeholder="${phW}"></td>
   <td><input type="number" inputmode="numeric" data-in="set" data-e="${ei}" data-s="${si}" data-k="r" value="${s.r!=null?s.r:''}" placeholder="${phR}"></td>
   <td><select data-in="set" data-e="${ei}" data-s="${si}" data-k="rir"><option value="">–</option>${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${String(s.rir)===String(v)?'selected':''}>${v}${v===5?'+':''}</option>`).join('')}</select></td>
   <td><button class="chk" data-act="setdone" data-e="${ei}" data-s="${si}" aria-label="Complete set">✓</button></td></tr>`}).join('')+
  `</table><div class="row" style="margin-top:6px"><button class="link" data-act="addset" data-e="${ei}">＋ Add set</button><span class="grow"></span>${e.sets.length?`<button class="link sm mut" data-act="rmset" data-e="${ei}">− Remove last</button>`:''}</div></div>`});
 h+=`<button class="btn full" data-act="addex" style="margin-bottom:12px">＋ Add exercise</button><div class="sm mut c">RIR = reps in reserve (0 = failure). Tap ✓ to log a set and start the rest timer; empty fields use the suggestion.</div>`;
 return h}
function newSessionFrom(name,items,progId,dayIdx){
 const A={id:uid(),start:Date.now(),name,progId:progId||null,dayIdx:dayIdx==null?null:dayIdx,exs:[]};
 items.forEach(i=>A.exs.push(newSessEx(i.exId,i.sets,i.repMin,i.repMax,i.rest)));return A}
function newSessEx(exId,n=3,repMin=8,repMax=12,rest){const ex=exById(exId);const sg=suggestNext(exId,repMin,repMax,n);
 return{exId,nSets:n,repMin,repMax,rest:rest||(ex.t==='c'?150:90),sets:Array.from({length:n},()=>({w:sg.w!=null?sg.w:null,r:null,rir:'',warm:false,done:false}))}}
function finishSession(){const A=S.train.active;const exs=A.exs.map(e=>({exId:e.exId,repMin:e.repMin,repMax:e.repMax,sets:e.sets.filter(s=>s.done&&s.r>0)})).filter(e=>e.sets.length);
 if(!exs.length)return null;const prs=[];
 for(const e of exs){const b=bestOf(e.exId,A.start);const had=exHistory(e.exId).length>0;let be=null,bw=null;
  for(const s of e.sets){if(s.warm)continue;const v=e1rm(s.w||0,s.r);if(v>b.e1+0.01&&(!be||v>be.v))be={v,s};if((s.w||0)>b.w+0.01&&(!bw||s.w>bw.s.w))bw={s}}
  if(had&&be)prs.push({exId:e.exId,type:'e1RM',val:be.v,set:be.s});if(had&&bw)prs.push({exId:e.exId,type:'weight',val:bw.s.w,set:bw.s})}
 const s={id:A.id,start:A.start,end:Date.now(),name:A.name,progId:A.progId,dayIdx:A.dayIdx,exs,prs};S.train.sessions.push(s);S.train.active=null;S.train.rest=null;save();return s}

 bar.style.display='flex';const l=Math.max(0,left);$('#restt').textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0');$('#restp').style.width=(100*(1-Math.max(0,R.end-Date.now())/(R.total*1000)))+'%';

  const food={key:CF.id||('c:'+uid()),name:CF.name.trim(),brand:CF.brand.trim(),per:'serv',n:{kcal:k,p,c,f},serv:{g:num(CF.g)||0,label:CF.label||'serving'}};

 // training
 startday:el=>{if(S.train.active)return toast('Finish or discard the current workout first');const p=activeProg();const di=+el.dataset.d;const d=p.days[di];S.train.active=newSessionFrom(d.name,d.items,p.id,di);save();U.ttab='workout';render()},
 startempty:()=>{if(S.train.active)return;S.train.active=newSessionFrom('Workout '+fmtShort(today()),[],null,null);save();render()},
 discard:()=>{if(!confirm('Discard this workout? Logged sets will be lost.'))return;S.train.active=null;S.train.rest=null;save();render()},
 finish:()=>{const A=S.train.active;const n=A.exs.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);if(!n){if(confirm('No completed sets. Discard workout?')){S.train.active=null;save();render()}return}
  const und=A.exs.reduce((a,e)=>a+e.sets.filter(s=>!s.done).length,0);if(und&&!confirm(und+' set(s) not checked off will be dropped. Finish?'))return;const s=finishSession();render();openSheet(summarySheet(s))},
 setdone:el=>{const e=S.train.active.exs[+el.dataset.e],s=e.sets[+el.dataset.s];
  if(s.done){s.done=false;save();render();return}
  const sg=suggestNext(e.exId,e.repMin,e.repMax,e.nSets);if(s.r==null&&!s.warm)s.r=sg.reps;if(s.w==null)s.w=s.warm?0:(sg.w!=null?sg.w:0);
  if(!(s.r>0))return toast('Enter reps first');s.done=true;save();render();startRest(s.warm?60:e.rest)},
 addset:el=>{const e=S.train.active.exs[+el.dataset.e];const last=e.sets.filter(s=>!s.warm).pop();e.sets.push({w:last?last.w:null,r:null,rir:'',warm:false,done:false});save();render()},
 rmset:el=>{S.train.active.exs[+el.dataset.e].sets.pop();save();render()},
 rmex:el=>{if(!confirm('Remove this exercise from the workout?'))return;S.train.active.exs.splice(+el.dataset.e,1);save();render()},
 warmups:el=>{const e=S.train.active.exs[+el.dataset.e];const ex=exById(e.exId);if(e.sets.some(s=>s.warm))return toast('Warm-ups already added');
  const first=e.sets.find(s=>!s.warm);const w=first&&first.w!=null?first.w:suggestNext(e.exId,e.repMin,e.repMax).w;if(!w)return toast('Enter a working weight first');
  const wu_=warmups(ex,w);if(!wu_.length)return toast('Weight is light — no warm-up sets needed');e.sets=wu_.map(x=>({w:x.w,r:x.r,rir:'',warm:true,done:false})).concat(e.sets);save();render();toast('Added '+wu_.length+' warm-up sets')},
 addex:()=>{EXP={mode:'workout'};U.exQ='';U.exM='';U.exEq='';openSheet(exPickerSheet)},
 exm:el=>{U.exM=el.dataset.v;SHEETS.length?renderSheets():render()},
 exeq:el=>{U.exEq=el.dataset.v;SHEETS.length?renderSheets():render()},
 expick:el=>{const id=el.dataset.v;if(!EXP)return openSheet(exDetailSheet(id));
  if(EXP.mode==='workout'){const ex=exById(id);S.train.active.exs.push(newSessEx(id,3,ex.t==='c'?6:10,ex.t==='c'?10:15));save();closeSheet();render()}
  else if(EXP.mode==='pb'){const ex=exById(id);PB.days[EXP.d].items.push({exId:id,sets:3,repMin:ex.t==='c'?6:10,repMax:ex.t==='c'?10:15,rest:ex.t==='c'?150:90});SHEETS.pop();EXP=null;renderSheets()}},
 newex:()=>{CX={name:U.exQ||'',m:U.exM||'Chest',eq:U.exEq||'Dumbbell',t:'c'};openSheet(customExSheet)},
 cxsave:()=>{if(!CX.name.trim())return toast('Name required');const id='cx-'+slug(CX.name)+'-'+uid().slice(-4);S.train.custom.push({id,name:CX.name.trim(),m:CX.m,eq:CX.eq,t:CX.t,custom:true});save();closeSheet();toast('Added '+CX.name);SHEETS.length?renderSheets():render()},
 delex:el=>{if(!confirm('Delete this custom exercise? History stays.'))return;S.train.custom=S.train.custom.filter(e=>e.id!==el.dataset.v);save();closeSheet();render()},
 usetpl:el=>{const t=TEMPLATES.find(x=>x.id===el.dataset.v);const p=JSON.parse(JSON.stringify(t));p.id='p-'+uid();delete p.desc;p.days.forEach(d=>d.items.forEach(i=>{i.rest=exById(i.exId).t==='c'?150:90}));S.train.programs.push(p);S.train.activeProg=p.id;save();toast(t.name+' is now active');render()},
 activate:el=>{S.train.activeProg=el.dataset.v;save();render()},
 newprog:()=>{PB={id:'p-'+uid(),name:'My program',days:[{name:'Day 1',items:[]}]};openSheet(progSheet)},
 editprog:el=>{PB=JSON.parse(JSON.stringify(S.train.programs.find(p=>p.id===el.dataset.v)));openSheet(progSheet)},
 pbaddday:()=>{PB.days.push({name:'Day '+(PB.days.length+1),items:[]});renderSheets()},

 pbaddex:el=>{EXP={mode:'pb',d:+el.dataset.d};U.exQ='';U.exM='';U.exEq='';openSheet(exPickerSheet)},
 pbrm:el=>{PB.days[+el.dataset.d].items.splice(+el.dataset.i,1);renderSheets()},
 pbmove:el=>{const it=PB.days[+el.dataset.d].items,i=+el.dataset.i;if(i>0)[it[i-1],it[i]]=[it[i],it[i-1]];renderSheets()},
 pbsave:()=>{if(!PB.name.trim())return toast('Name required');if(PB.days.some(d=>!d.items.length))return toast('Every day needs at least one exercise');
  for(const d of PB.days)for(const i of d.items){i.sets=Math.max(1,+i.sets||3);i.repMin=Math.max(1,+i.repMin||8);i.repMax=Math.max(i.repMin,+i.repMax||i.repMin);i.rest=Math.max(15,+i.rest||90)}
  const ix=S.train.programs.findIndex(p=>p.id===PB.id);if(ix>=0)S.train.programs[ix]=PB;else S.train.programs.push(PB);if(!S.train.activeProg||ix<0)S.train.activeProg=PB.id;save();closeSheet();toast('Program saved');render()},
 pbdel:()=>{if(!confirm('Delete this program? Workout history stays.'))return;S.train.programs=S.train.programs.filter(p=>p.id!==PB.id);if(S.train.activeProg===PB.id)S.train.activeProg=S.train.programs[0]?S.train.programs[0].id:null;save();closeSheet();render()},

};
document.addEventListener('click',ev=>{const bg=ev.target.closest('.sheet-bg');if(bg&&ev.target===bg){closeSheet();return}
 const el=ev.target.closest('[data-act]');if(!el)return;const fn=ACTIONS[el.dataset.act];if(fn){ev.preventDefault();try{fn(el)}catch(e){console.error(e);toast('Error: '+e.message)}}});
function onInput(ev){const el=ev.target;const k=el.dataset.in;if(!k)return;const v=el.value;
 switch(k){
  case 'pickq':U.pickQ=v;U.offRes=null;U.offErr='';refreshPick();break;
  case 'fsqty':FS.qty=v;$('#fsmac').innerHTML=macroStats(fsMacros());break;
  case 'fsunit':{const f=FS.food;const g=FS.unit==='g'?+FS.qty:(+FS.qty)*(f.per==='100g'?(f.serv?f.serv.g:100):(f.serv.g||0));FS.unit=v;FS.qty=v==='g'?r0(g):r1(g/(f.serv&&f.serv.g||100));renderSheets();break}
  case 'fsmeal':FS.meal=v;break;
  case 'qa':QA[el.dataset.k]=v;break;
  case 'cf':CF[el.dataset.k]=v;break;
  case 'rd':RD[el.dataset.k]=v;{const x=$('#rdper');if(x)x.innerHTML=rdPer()}break;
  case 'tg':{const kk=el.dataset.k;TG[kk]=+v;if(kk==='kcal')TG.c=Math.max(0,r0((TG.kcal-4*TG.p-9*TG.f)/4));else TG.kcal=4*TG.p+4*TG.c+9*TG.f;
   document.querySelectorAll('[data-in=tg]').forEach(x=>{if(x!==el)x.value=TG[x.dataset.k]});const n=$('#tgnote');if(n)n.textContent='Macros = '+(4*TG.p+4*TG.c+9*TG.f)+' kcal.';break}
  case 'ob':break;
  case 'set':{const e=S.train.active.exs[+el.dataset.e],s=e.sets[+el.dataset.s];const kk=el.dataset.k;if(kk==='w')s.w=num(v)==null?null:u2kg(+v);else if(kk==='r')s.r=num(v)==null?null:Math.round(+v);else s.rir=v;save();break}
  case 'exq':U.exQ=v;refreshEx();break;
  case 'progex':U.progEx=v;render();break;
  case 'pbname':PB.name=v;break;
  case 'pbday':PB.days[+el.dataset.d].name=v;break;
  case 'pbit':PB.days[+el.dataset.d].items[+el.dataset.i][el.dataset.k]=+v;break;
  case 'cx':CX[el.dataset.k]=v;break;
 }}
document.addEventListener('input',ev=>{if(ev.target.dataset.ob){OB[ev.target.dataset.ob]=ev.target.value;return}if(ev.target.tagName!=='SELECT')onInput(ev)});
document.addEventListener('change',ev=>{if(ev.target.id==='importf'){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.v||!('logs' in d))throw new Error('not a backup file');
  if(!confirm('Replace all current data with this backup?'))return;S=Object.assign(defState(),d,{train:Object.assign(defState().train,d.train||{})});save();SHEETS=[];renderSheets();toast('Backup restored');render()}catch(e){toast('Import failed: '+e.message)}};rd.readAsText(f);ev.target.value='';return}
 if(ev.target.tagName==='SELECT')onInput(ev);
});
